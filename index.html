<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smart Fitao · Phone photo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; background: #0a0a0a; color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    #wrap { min-height: 100dvh; display: flex; flex-direction: column; }
    .stage { flex: 1; position: relative; background: #111; min-height: 280px; }
    video, .preview {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    video { transform: scaleX(-1); }
    .hint {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
      max-width: 92%; text-align: center; background: rgba(0,0,0,.6);
      padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    }
    .bar {
      flex-shrink: 0; display: flex; gap: 12px; justify-content: center;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      background: #111; border-top: 1px solid #222;
    }
    button {
      border: none; border-radius: 999px; padding: 14px 28px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .primary { background: #059669; color: #fff; min-width: 160px; }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .ghost { background: rgba(255,255,255,.12); color: #fff; }
    .err, .ok {
      position: absolute; bottom: 88px; left: 16px; right: 16px; z-index: 6;
      padding: 12px 14px; border-radius: 12px; font-size: 14px; text-align: center;
    }
    .err { background: rgba(220,38,38,.9); }
    .ok { background: rgba(5,150,105,.92); }
    .loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(0,0,0,.5); z-index: 4; font-weight: 600;
    }
    .landing {
      padding: 32px 20px; text-align: center; max-width: 420px; margin: auto;
    }
    .landing h1 { font-size: 1.35rem; margin: 0 0 12px; }
    .landing p { color: #aaa; line-height: 1.55; font-size: 15px; }
    .logo { color: #059669; font-weight: 800; letter-spacing: .04em; font-size: 13px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="landing" class="landing" hidden>
      <p class="logo">SMART FITAO</p>
      <h1>Phone photo for try-on</h1>
      <p>
        Scan the QR code on the <strong>2D Try-On</strong> page on your computer.
        This page opens on your phone so you can take a photo in shalwar kameez —
        it is sent automatically to the website.
      </p>
    </div>
    <div id="camera" hidden>
      <div class="stage">
        <video id="video" playsinline muted autoplay></video>
        <img id="preview" class="preview" alt="" hidden />
        <div class="hint" id="hint">Wear shalwar kameez · full body · tap Capture</div>
        <div id="loading" class="loading" hidden>Starting camera…</div>
        <div id="err" class="err" hidden></div>
        <div id="ok" class="ok" hidden></div>
      </div>
      <div class="bar">
        <button type="button" class="ghost" id="retakeBtn" hidden>Retake</button>
        <button type="button" class="primary" id="actionBtn" disabled>Open camera</button>
      </div>
    </div>
  </div>
  <canvas id="canvas" hidden></canvas>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var phoneSession = params.get('phone_session') || params.get('session') || '';

      var landing = document.getElementById('landing');
      var camera = document.getElementById('camera');
      var video = document.getElementById('video');
      var preview = document.getElementById('preview');
      var canvas = document.getElementById('canvas');
      var actionBtn = document.getElementById('actionBtn');
      var retakeBtn = document.getElementById('retakeBtn');
      var loading = document.getElementById('loading');
      var errEl = document.getElementById('err');
      var okEl = document.getElementById('ok');
      var hint = document.getElementById('hint');

      var stream = null;
      var capturedDataUrl = null;
      var busy = false;

      if (!phoneSession) {
        landing.hidden = false;
        return;
      }

      camera.hidden = false;

      function showErr(msg) {
        errEl.textContent = msg;
        errEl.hidden = !msg;
      }
      function showOk(msg) {
        okEl.textContent = msg;
        okEl.hidden = !msg;
      }

      async function stopCamera() {
        if (stream) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          stream = null;
        }
        video.hidden = false;
        preview.hidden = true;
      }

      async function startCamera() {
        showErr('');
        showOk('');
        loading.hidden = false;
        actionBtn.disabled = true;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 960 },
            },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
          actionBtn.textContent = 'Capture photo';
          actionBtn.disabled = false;
        } catch (e) {
          showErr('Allow camera access in browser settings, then tap Retry.');
          actionBtn.textContent = 'Retry camera';
          actionBtn.disabled = false;
        } finally {
          loading.hidden = true;
        }
      }

      function takePhoto() {
        var w = video.videoWidth || 720;
        var h = video.videoHeight || 960;
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(video, 0, 0, w, h);
        capturedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
        preview.src = capturedDataUrl;
        preview.hidden = false;
        video.hidden = true;
        stopCamera();
        retakeBtn.hidden = false;
        actionBtn.textContent = 'Send to website';
        sendPhoto();
      }

      async function compressDataUrl(dataUrl, maxWidth) {
        return new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () {
            var w = img.width;
            var h = img.height;
            if (w > maxWidth) {
              h = Math.round(h * (maxWidth / w));
              w = maxWidth;
            }
            var c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = function () { resolve(dataUrl); };
          img.src = dataUrl;
        });
      }

      async function uploadToBlob(sessionId, dataUrl) {
        var compressed = await compressDataUrl(dataUrl, 960);
        var blob = await fetch(compressed).then(function (r) { return r.blob(); });
        var fd = new FormData();
        fd.append('photo', blob, 'tryon-photo.jpg');
        var uploadUrl = location.origin + '/api/phone-sync?session=' +
          encodeURIComponent(sessionId) + '&upload=1';
        var res = await fetch(uploadUrl, { method: 'POST', body: fd });
        if (!res.ok) {
          var j = {};
          try { j = await res.json(); } catch (e) {}
          throw new Error(j.error || ('Upload failed (' + res.status + ')'));
        }
        return res.json();
      }

      async function sendPhoto() {
        if (!capturedDataUrl || busy) return;
        busy = true;
        actionBtn.disabled = true;
        retakeBtn.disabled = true;
        showErr('');
        showOk('Uploading to Vercel Blob…');

        try {
          await uploadToBlob(phoneSession, capturedDataUrl);
          showOk('Done! Your photo is on the try-on page — go back to your computer.');
          actionBtn.textContent = 'Sent ✓';
        } catch (e) {
          showErr(e.message || 'Could not send photo. Check internet and try again.');
          actionBtn.disabled = false;
          retakeBtn.disabled = false;
          actionBtn.textContent = 'Send to website';
        } finally {
          busy = false;
        }
      }

      async function retake() {
        capturedDataUrl = null;
        retakeBtn.hidden = true;
        showOk('');
        showErr('');
        busy = false;
        await startCamera();
      }

      actionBtn.addEventListener('click', function () {
        if (!stream && !capturedDataUrl) {
          startCamera();
          return;
        }
        if (!capturedDataUrl) {
          takePhoto();
        } else if (!busy) {
          sendPhoto();
        }
      });
      retakeBtn.addEventListener('click', retake);

      startCamera();
    })();
  </script>
</body>
</html>
